<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Demo | Prathibha Kalagani</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700&display=swap');
:root{--bg:#07100c;--panel:#0e1c16;--line:rgba(193,241,214,.17);--text:#f3f7f4;--muted:#91a49a;--green:#89f0bd;--lime:#d5ff8c;--pink:#ff4fd8;--blue:#55d7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Manrope,sans-serif}.shell{min-height:100vh}.topbar{height:72px;padding:0 clamp(20px,5vw,70px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:700}.brand span{color:var(--green)}.back{color:var(--muted);font:11px 'DM Mono';text-decoration:none;border-bottom:1px solid var(--green);padding-bottom:5px}.back:hover{color:var(--green)}main{display:grid;grid-template-columns:minmax(280px,.6fr) minmax(0,1.4fr);min-height:calc(100vh - 72px)}.copy{padding:clamp(34px,6vw,90px);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--green);font:11px 'DM Mono';text-transform:uppercase;letter-spacing:.1em}.copy h1{font-size:clamp(42px,6vw,82px);line-height:.95;letter-spacing:-.055em;margin:24px 0}.copy p{color:var(--muted);font-size:16px;line-height:1.7;max-width:550px}.stack{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);color:var(--green);font:10px/1.7 'DM Mono';text-transform:uppercase}.stage{position:relative;min-height:620px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,rgba(137,240,189,.07),transparent 65%)}.controls{position:absolute;left:20px;right:20px;bottom:22px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:4}.controls button,.dash-head button{border:1px solid var(--line);background:rgba(14,28,22,.9);color:var(--text);font:11px 'DM Mono';padding:11px 16px;cursor:pointer}.controls button:hover,.dash-head button:hover{border-color:var(--green);color:var(--green)}.controls input{accent-color:var(--green)}
.cube-scene{width:220px;height:220px;perspective:700px}.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 7s linear infinite}.cube.paused{animation-play-state:paused}.face{position:absolute;width:220px;height:220px;border:2px solid var(--green);background:rgba(137,240,189,.08)}.front{transform:translateZ(110px)}.backface{transform:rotateY(180deg) translateZ(110px)}.right{transform:rotateY(90deg) translateZ(110px)}.left{transform:rotateY(-90deg) translateZ(110px)}.top{transform:rotateX(90deg) translateZ(110px)}.bottom{transform:rotateX(-90deg) translateZ(110px)}@keyframes spin{to{transform:rotateX(360deg) rotateY(720deg)}}canvas{width:100%;height:100%;display:block}
.glass-demo{width:min(560px,76%);height:380px;border-radius:42px;position:relative;background:#173026;overflow:hidden}.glass-bg{position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,var(--pink),transparent 30%),radial-gradient(circle at 75% 70%,var(--blue),transparent 36%)}.glass-card{position:absolute;width:230px;height:230px;left:calc(50% - 115px);top:calc(50% - 115px);border-radius:38% 48% 42% 45%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 25px 70px rgba(0,0,0,.35);transition:transform .1s}.glass-card:before{content:'PK';position:absolute;inset:0;display:grid;place-items:center;font:600 74px Manrope;color:rgba(255,255,255,.78)}
.dashboard{width:min(850px,90%);display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.dash-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.metric,.chart,.activity{background:var(--panel);border:1px solid var(--line);padding:22px}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font:500 30px 'DM Mono';margin-top:10px;color:var(--green)}.chart{grid-column:1/3;height:250px;display:flex;align-items:flex-end;gap:10px}.bar{flex:1;background:linear-gradient(var(--green),rgba(137,240,189,.16));height:var(--h);transition:height .4s}.activity{font-size:12px;color:var(--muted)}.activity b{color:var(--text);display:block;margin-bottom:16px}.activity div{padding:10px 0;border-top:1px solid var(--line)}
.shop{width:min(900px,92%)}.shop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.cart{color:var(--green);font:12px 'DM Mono'}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{background:var(--panel);border:1px solid var(--line);padding:16px}.product-art{height:180px;background:linear-gradient(145deg,rgba(137,240,189,.3),rgba(137,240,189,.03));display:grid;place-items:center;font-size:72px}.product h3{font-size:16px}.product small{color:var(--muted)}.product button{width:100%;margin-top:16px;padding:10px;border:1px solid var(--green);background:transparent;color:var(--green);cursor:pointer}.product button:hover{background:var(--green);color:var(--bg)}
.island-scene{position:relative;width:min(800px,90%);height:450px;border-radius:26px;overflow:hidden;background:linear-gradient(#4bb9d5 0 58%,#177694 58%);transition:background .5s}.island-scene.night{background:linear-gradient(#081b43 0 58%,#071b30 58%)}.sun{position:absolute;width:70px;height:70px;border-radius:50%;background:#fff19a;right:12%;top:12%;box-shadow:0 0 45px #fff19a}.night .sun{background:#eaf1ff;box-shadow:0 0 35px #c6d5ff}.island{position:absolute;width:300px;height:75px;border-radius:50%;background:#d6b66d;left:calc(50% - 150px);top:58%}.palm{position:absolute;width:14px;height:190px;background:#6b4328;left:49%;top:25%;transform:rotate(7deg)}.palm:before,.palm:after{content:'';position:absolute;width:120px;height:42px;border-radius:50%;background:#45a565;top:-12px}.palm:before{left:-95px;transform:rotate(22deg)}.palm:after{left:-10px;transform:rotate(-20deg)}.wave{position:absolute;left:-20%;bottom:12%;width:140%;height:24px;border-top:3px solid rgba(255,255,255,.65);border-radius:50%;animation:wave 2.4s ease-in-out infinite}@keyframes wave{50%{transform:translateX(45px) translateY(10px)}}
@media(max-width:850px){main{grid-template-columns:1fr}.copy{border-right:0;border-bottom:1px solid var(--line)}.stage{min-height:560px}.dashboard{grid-template-columns:1fr 1fr}.chart,.activity{grid-column:1/-1}.products{grid-template-columns:1fr}.shop{padding:40px 0}}
</style>
</head>
<body><div class="shell"><header class="topbar"><div class="brand">PK<span>.</span> LAB</div><a class="back" href="./">← Back to portfolio</a></header><main><section class="copy"><span class="eyebrow" id="category"></span><h1 id="title"></h1><p id="description"></p><div class="stack" id="stack"></div></section><section class="stage" id="stage"></section></main></div>
<script>
const demos={
'the-cube':{c:'3D / Motion',t:'The Cube',d:'Pause the cube or change its rotation speed. This demo explores perspective, light, and motion using native browser 3D transforms.',s:'CSS 3D · Transform · Interaction',h:`<div class="cube-scene"><div class="cube" id="cube"><i class="face front"></i><i class="face backface"></i><i class="face right"></i><i class="face left"></i><i class="face top"></i><i class="face bottom"></i></div></div><div class="controls"><button id="toggle">Pause motion</button><label>Speed <input id="speed" type="range" min="2" max="14" value="7"></label></div>`},
'cyberpunk-tunnel':{c:'3D / Canvas',t:'Cyberpunk Tunnel',d:'Move your pointer to steer through an animated neon tunnel rendered in real time.',s:'Canvas · JavaScript · Real-time Motion',h:`<canvas id="tunnel"></canvas><div class="controls"><button id="color">Change neon color</button></div>`},
'liquid-glass-apple':{c:'Motion / Visual Effects',t:'Liquid Glass Apple',d:'Move your pointer across the glass surface. The translucent material follows your movement while refracting the colored background.',s:'CSS Glass · Pointer Interaction · Visual Design',h:`<div class="glass-demo" id="glass"><div class="glass-bg"></div><div class="glass-card" id="glassCard"></div></div><div class="controls"><button id="resetGlass">Reset position</button></div>`},
'react-dashboard':{c:'UI / Dashboard',t:'React Dashboard',d:'Refresh the sample data to see the operational cards and chart update dynamically.',s:'Component UI · Data Visualization · Responsive Grid',h:`<div class="dashboard"><div class="dash-head"><strong>Transaction overview</strong><button id="refresh">Refresh data</button></div><div class="metric"><span>Processed volume</span><strong id="volume"></strong></div><div class="metric"><span>Success rate</span><strong id="rate"></strong></div><div class="metric"><span>Active users</span><strong id="users"></strong></div><div class="chart" id="bars"></div><div class="activity"><b>Recent activity</b><div>Transfer completed</div><div>Payment verified</div><div>New user registered</div></div></div>`},
'e-commerce-landing':{c:'UI / Commerce',t:'E-Commerce Landing',d:'Explore a compact storefront and add products to the cart for direct interaction feedback.',s:'Responsive UI · Cart State · Product Design',h:`<div class="shop"><div class="shop-head"><h2>New arrivals</h2><span class="cart">Cart: <b id="count">0</b></span></div><div class="products"><article class="product"><div class="product-art">◈</div><h3>Everyday Pack</h3><small>$68</small><button>Add to cart</button></article><article class="product"><div class="product-art">◒</div><h3>Studio Lamp</h3><small>$94</small><button>Add to cart</button></article><article class="product"><div class="product-art">△</div><h3>Travel Bottle</h3><small>$32</small><button>Add to cart</button></article></div></div>`},
'monkey-island':{c:'Motion / CSS',t:'Monkey Island Animation',d:'Switch between day and night while the waves continue moving around the island.',s:'CSS Animation · Scene Design · Theme State',h:`<div class="island-scene" id="island"><div class="sun"></div><div class="island"></div><div class="palm"></div><div class="wave"></div></div><div class="controls"><button id="time">Switch to night</button></div>`}}
const q=new URLSearchParams(location.search).get('project')||'the-cube',demo=demos[q]||demos['the-cube'],by=id=>document.getElementById(id);by('category').textContent=demo.c;by('title').textContent=demo.t;by('description').textContent=demo.d;by('stack').textContent=demo.s;by('stage').innerHTML=demo.h;document.title=demo.t+' | Prathibha Kalagani';
if(q==='the-cube'){by('toggle').onclick=()=>{by('cube').classList.toggle('paused');by('toggle').textContent=by('cube').classList.contains('paused')?'Resume motion':'Pause motion'};by('speed').oninput=()=>by('cube').style.animationDuration=by('speed').value+'s'}
if(q==='cyberpunk-tunnel'){const c=by('tunnel'),x=c.getContext('2d');let hue=160,mx=.5,my=.5,t=0;const size=()=>{c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio};size();addEventListener('resize',size);c.onpointermove=e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)/r.width;my=(e.clientY-r.top)/r.height};by('color').onclick=()=>hue=(hue+80)%360;(function draw(){t+=.018;x.fillStyle='rgba(4,7,14,.22)';x.fillRect(0,0,c.width,c.height);for(let i=0;i<28;i++){const z=(i/28+t)%1,s=.04+z*.92,w=c.width*s,h=c.height*s,cx=c.width*(.5+(mx-.5)*(.5-z)*.8),cy=c.height*(.5+(my-.5)*(.5-z)*.8);x.strokeStyle=`hsla(${hue+i*4},100%,65%,${z})`;x.lineWidth=2*devicePixelRatio;x.strokeRect(cx-w/2,cy-h/2,w,h)}requestAnimationFrame(draw)})()}
if(q==='liquid-glass-apple'){by('glass').onpointermove=e=>{const r=by('glass').getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/10,y=(e.clientY-r.top-r.height/2)/10;by('glassCard').style.transform=`translate(${x}px,${y}px) rotate(${x/15}deg)`};by('resetGlass').onclick=()=>by('glassCard').style.transform='none'}
if(q==='react-dashboard'){const update=()=>{by('volume').textContent='$'+(70+Math.random()*35).toFixed(1)+'K';by('rate').textContent=(96+Math.random()*3.8).toFixed(1)+'%';by('users').textContent=Math.floor(1100+Math.random()*500).toLocaleString();by('bars').innerHTML=Array.from({length:12},()=>`<i class="bar" style="--h:${25+Math.random()*72}%"></i>`).join('')};by('refresh').onclick=update;update()}
if(q==='e-commerce-landing'){let n=0;document.querySelectorAll('.product button').forEach(b=>b.onclick=()=>{by('count').textContent=++n;b.textContent='Added ✓';setTimeout(()=>b.textContent='Add to cart',850)})}
if(q==='monkey-island'){by('time').onclick=()=>{by('island').classList.toggle('night');by('time').textContent=by('island').classList.contains('night')?'Switch to day':'Switch to night'}}
</script></body></html>
